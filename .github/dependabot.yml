version: 2
updates:
  - package-ecosystem: gradle
    directories:
      - /
      - /tools/compatibility-smoke
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      android-toolchain:
        patterns:
          - "com.android*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "androidx.room3*"
          - "io.insert-koin*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
