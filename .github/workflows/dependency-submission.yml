name: Dependency graph submission

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    name: Submit dependency graph (${{ matrix.directory }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'tools/compatibility-smoke']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 27
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '27'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Submit resolved Gradle dependencies
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          build-root-directory: ${{ matrix.directory }}
          additional-arguments: '--no-daemon --no-configuration-cache --console plain'
          dependency-graph: generate-and-submit
          validate-wrappers: true
