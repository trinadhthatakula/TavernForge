name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  statuses: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Load trusted snapshot availability check
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/.github/scripts/dependency_graph.py?ref=$TRUSTED_SHA" \
            -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/dependency_graph.py"
      - name: Require verified snapshots before review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/dependency_graph.py" wait --timeout 1500
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: true
          comment-summary-in-pr: never
