name: Android internal build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Java 27
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '27'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Verify fixture provenance
        run: python3 format/fixtures/verify_manifest.py
      - name: Test dependency snapshot safeguards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Test foundations and build internal APK
        run: ./gradlew :core:model:test :format:test :data:testDebugUnitTest :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease :data:lintDebug :app:lintDebug :app:lintRelease --no-daemon --console plain
      - name: Check optimized unsigned APK
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, zipfile
          apk = pathlib.Path('app/build/outputs/apk/release/app-release-unsigned.apk')
          mapping = pathlib.Path('app/build/outputs/mapping/release/mapping.txt')
          assert mapping.is_file() and mapping.stat().st_size > 0, 'Missing R8 mapping'
          aapt = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/37.0.0/aapt2'
          badging = subprocess.check_output([str(aapt), 'dump', 'badging', str(apk)], text=True)
          assert "package: name='com.valhalla.tavernforge'" in badging
          assert 'application-debuggable' not in badging, 'Release APK is debuggable'
          with zipfile.ZipFile(apk) as archive:
              assert 'classes.dex' in archive.namelist()
              assert archive.testzip() is None
              assert archive.read('assets/open_source_notices.txt') == pathlib.Path('app/src/main/assets/open_source_notices.txt').read_bytes(), 'Missing or stale bundled notices'
          print('Optimized unsigned APK verified:', apk.stat().st_size, 'bytes; SHA256', hashlib.sha256(apk.read_bytes()).hexdigest())
          PY
      - name: Set up pinned PNG reference runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
      - name: Check PNG outputs with pinned SillyTavern reader
        run: |
          npm ci --prefix format/fixtures/reference/png --ignore-scripts --no-audit --no-fund
          node format/fixtures/reference/png/check.mjs format/build/png-reference
      - name: Verify isolated toolchain probe
        run: ./gradlew -p tools/compatibility-smoke :probe:testDebugUnitTest :probe:assembleDebug --no-daemon --console plain
      - name: Retain internal APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TavernForge-internal-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            core/model/build/reports/tests/
            format/build/reports/tests/
            data/build/reports/tests/
            app/build/reports/tests/
            tools/compatibility-smoke/probe/build/reports/tests/
          retention-days: 7
      - name: Retain optimized unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: TavernForge-unsigned-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Retain matching R8 metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: r8-metadata-${{ github.sha }}
          path: app/build/outputs/mapping/release/
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest internal APKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: TavernForge-*-${{ github.sha }}
          path: dist
      - name: Attest APK provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/**/*.apk
